name: SEO build validation

on:
  push:
    branches:
      - seo-indexing-fixes-2026-11-07
  pull_request:
    branches:
      - main

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build production application
        run: npm run build
