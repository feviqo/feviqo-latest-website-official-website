    <!-- Chrome Extension Error Suppression & Stale Asset Cache-Busting Recovery -->
    <script>
      window.addEventListener('error', function(e) {
        if ((e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('property fetch of') !== -1)) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
        var target = e.target || e.srcElement;
        if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
          var assetUrl = target.src || target.href || '';
          if (assetUrl && assetUrl.indexOf('/assets/') !== -1) {
            try {
              var reloadKey = 'feviqo_asset_recover_v1';
              var prevTs = Number(sessionStorage.getItem(reloadKey) || '0');
              if (Date.now() - prevTs > 15000) {
                sessionStorage.setItem(reloadKey, String(Date.now()));
                var nextUrl = new URL(window.location.href);
                nextUrl.searchParams.set('_v', String(Date.now()));
                window.location.replace(nextUrl.toString());
              }
            } catch (_) {}
          }
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (
          (e.reason.message && e.reason.message.indexOf('property fetch of') !== -1) ||
          (e.reason.stack && e.reason.stack.indexOf('chrome-extension://') !== -1)
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return;
        }
        var msg = (e.reason && (e.reason.message || String(e.reason))) || '';
        if (
          msg.indexOf('Failed to fetch dynamically imported module') !== -1 ||
          msg.indexOf('Importing a module script failed') !== -1 ||
          msg.indexOf('Unable to preload CSS') !== -1 ||
          msg.indexOf('Loading chunk') !== -1
        ) {
          try {
            var chunkKey = 'feviqo_chunk_recover_v1';
            var lastAttempt = Number(sessionStorage.getItem(chunkKey) || '0');
            if (Date.now() - lastAttempt > 15000) {
              sessionStorage.setItem(chunkKey, String(Date.now()));
              var reloadUrl = new URL(window.location.href);
              reloadUrl.searchParams.set('_v', String(Date.now()));
              window.location.replace(reloadUrl.toString());
            }
          } catch (_) {}
        }
      }, true);
    </script>
